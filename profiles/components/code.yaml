profile:
  identity:
    profile_id: code-explanation
    revision: round-6-self-iterative-cross-model
    description: 代码按照零先验读者处理，并保留原始可执行代码后解释功能、原因、输入、结果和边界；同行注释属于可修复的解释层
  source_order:
    original_code:
      policy: before_or_with_explanation
      severity: PROFILE_REQUIRED
      description: 原始可执行代码必须出现在候选答案中，解释不得用摘要替代代码证据；局部修复可以调整生成的同行注释文本和对齐空格，但不得改变代码语句、字面值、调用关系或控制条件
  inline_format:
    identifiers:
      policy: backticks
      severity: MACHINE_FINAL
      description: 正文中的命令、字段、参数、路径、代码类型、标识符和被复述的源代码字面量使用反引号；例如代码边界中的 1、2、3、0、n、n-1 应分别标记
  comment_granularity:
    single_command:
      description: 独立生效的单行命令使用同行注释
    configuration_item:
      description: 独立配置项使用同行注释
    functional_block:
      description: 完整功能块在块开头解释功能、输入、原因和结果
    non_obvious_statement:
      description: 不直观语句增加同行注释
    closing_syntax:
      description: 纯括号和闭合符继承所在块说明，不添加机械废注释
    non_commentable_format:
      description: JSON 等不能合法添加注释的格式保留原始版本，再为每个有效语句或字段提供可定位的逐行解释；不得用伪注释或等价改写冒充原格式覆盖
  comment_alignment:
    mode:
      policy: longest_commentable_line
      description: 同一代码块内先去掉代码尾部空白，再按四列制表位计算每个可注释语句的显示宽度；最长宽度为 L 时，所有注释标记从第 L+2 列开始
    scope:
      policy: per_code_block
      description: 每个代码块独立计算目标列，不跨代码块对齐
    overflow:
      policy: allow
      description: 注释对齐优先于任意固定行宽，不能为了缩短行宽把同行注释移到下一行
    exemptions:
      policy: structural_only
      description: 空行、纯闭合符和只承担结构作用的括号不添加机械注释，也不参与最长行计算
    construction:
      policy: exact_padding
      description: 可注释行显示宽度为 W、同块最长宽度为 L 时，在代码后补 L-W+1 个空格再写注释标记；最长行也必须保留一个分隔空格，注释标记的 1 基列号因此固定为 L+2
    preflight:
      policy: deterministic_helper_required
      description: 两个以上可注释语句必须先把代码块正文通过标准输入交给 runtime/align_inline_comments.py 对齐，再对最终正文运行 --check；只有检查返回 PASS 才能输出，不能凭视觉估计或声称已经对齐
  coverage_modes:
    annotated_code:
      description: 在代码中加入目标语言允许的合法同行注释，覆盖每个有效语句或功能块，并始终按最长可注释代码行对齐
    line_by_line_explanation:
      description: 在代码后为每个有效语句建立独立且可定位的解释；密集段落不能代替逐行映射；该路径的同行对齐记为 not_applicable
    equivalence:
      description: 两种路径具有相同覆盖要求；选择逐行解释时，每个有效代码单元都必须登记解释位置
  required_coverage:
    tool:
      description: 说明语言或工具是什么以及读者如何运行或查询
    action:
      description: 说明这一行或功能块做什么
    reason:
      description: 说明为什么需要以及为什么采用当前写法
    syntax:
      description: 说明影响理解的关键语法和数据类型
    input:
      description: 说明输入从哪里来以及允许什么形式
    result:
      description: 说明执行后的可观察结果
    failure:
      description: 说明失败表现、退出状态和调用方如何识别失败
    side_effect:
      description: 说明会读取、写入、删除、联网或改变哪些对象
    compatibility:
      description: 说明运行环境、版本或格式边界
    evidence_boundary:
      description: 说明代码结果不能证明什么、缺少什么证据和怎样继续核对
    variable_scope:
      description: 可配置或可迭代输入的次数、上限和失败边界必须绑定实际默认值或输入长度；有 n 个输入值时区分最多调用 n 次与最多重试 n-1 次，并单独说明空输入的零调用边界；调用次数、重试次数和空输入边界不得用中文分号压在同一列表项中；自定义输入可能改变范围时必须明确说明
