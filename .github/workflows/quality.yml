name: vNext candidate checks # 在仓库页面显示候选基础检查名称

on: # 指定需要重新验证候选文件树的事件
  push: # 每次候选分支或默认分支推送后运行
  pull_request: # 外部贡献使用拉取请求时运行，不改变本项目的直接推送约定
  workflow_dispatch: # 允许维护者手动重新验证当前提交

permissions: # 限制自动任务只能读取仓库内容
  contents: read # 检查任务不能修改分支、标签或发布内容

jobs: # 定义相互独立的自动检查任务
  vnext-runtime: # 验证 vNext 契约、运行时、生命周期、补丁事务和前向审核材料
    runs-on: ubuntu-latest # 使用干净 Linux 环境证明基础实现不依赖本机状态
    steps: # 按照依赖准备、确定性检查、提交器测试和生成物核对的顺序执行
      - name: Check out repository # 下载触发本次检查的精确提交
        uses: actions/checkout@v5 # 使用官方仓库下载动作，不写回远端

      - name: Set up Python # 安装与本地候选基线一致的 Python 主版本
        uses: actions/setup-python@v5 # 使用官方 Python 环境准备动作
        with: # 把运行版本固定在任务分类下面
          python-version: "3.12" # 当前候选基础在 Python 3.12 上验证

      - name: Install validation dependencies # 安装 JSON Schema 和 YAML 解析依赖
        run: python -m pip install jsonschema==4.23.0 PyYAML==6.0.2 # 使用本地验证过的精确版本，避免依赖漂移改变结果

      - name: Compile Python sources # 在运行以前发现语法和编码错误
        run: python -m compileall -q patcher runtime scripts tests validators # 只编译 vNext 实现、验证器和测试

      - name: Validate vNext foundation # 验证权威计划、契约、YAML 分类、候选案例、链接、SVG 和隐私模式
        run: python scripts/validate_vnext_foundation.py # 任一确定性缺陷都会返回非零退出状态

      - name: Execute 236 deterministic fixtures # 运行十七类确定性规则的独立正反例
        run: python scripts/run_vnext_fixtures.py # 结果必须为 236/236，数量或判定不一致都会失败

      - name: Validate 62 lifecycle records and 5 revised candidates # 验证 Gold 快照、版本化拒绝、首次前向证据和新候选来源覆盖
        run: python scripts/validate_vnext_lifecycle.py # 第一轮人工接受率保持 8/20，五个新候选保持未批准

      - name: Validate 32 contextual cases # 检查术语、排比、代码、内容充分性、多轮、主语、标点和段落的职责边界
        run: python scripts/validate_context_cases.py # 已登记结构允许确定性判断，语义边界继续由 Agent 或用户决定

      - name: Validate 72-case trigger matrix design # 核对三类任务各自的显式、隐式、负向和规则遵守案例槽位
        run: python scripts/validate_trigger_matrix.py # 只证明公开案例清单为 3 x 4 x 6，不冒充 72 次真实隔离执行结果

      - name: Validate first forward round # 核对 20 个首次生成答案的摘要、来源映射、组件保留和隐私
        run: python scripts/validate_forward_round1.py # 只检查确定性事实，人工接受结果继续保持为空

      - name: Test deterministic committer # 验证精确替换、拒绝路径和整批回滚
        run: python -m unittest discover -s tests -p "test_deterministic_committer.py" -v # 运行 18 个提交器专用测试，不执行旧架构评测

      - name: Test executable runtime # 验证 compile、verify、repair 和 report 的结构化接口
        run: python -m unittest discover -s tests -p "test_vnext_runtime.py" -v # 运行 30 个运行时测试，不要求外部 Agent

      - name: Verify generated evidence synchronization # 确认确定性案例、审核包和前向候选摘要能够从登记源重建
        run: python scripts/build_vnext_minimal_cases.py && python scripts/build_vnext_trigger_matrix.py && python scripts/build_forward_round1_requests.py && python scripts/materialize_forward_round1.py && python scripts/apply_vnext_round3_review.py && python scripts/build_round4_review_packet.py && python scripts/apply_vnext_round4_review.py && python scripts/build_round5_review_packet.py && git diff --exit-code -- evals/candidate evals/gold evals/rejected evals/deterministic/vnext-1.1-minimal-cases.jsonl evals/trigger-matrix/vnext-1.1-72-cases.jsonl evals/forward/round-1 evals/reviews/vnext-1.1-round-4-REVIEW-PACKET.md evals/reviews/vnext-1.1-round-5-REVIEW-PACKET.md # 任何用户快照、首次答案、触发矩阵案例或修订证据变化都会阻止候选提交
