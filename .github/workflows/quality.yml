name: Quality checks # 在仓库页面显示这组自动检查的名称

on: # 指定哪些仓库事件会触发检查
  push: # 每次推送后验证默认分支仍然通过
  pull_request: # 每次合并请求变更后验证候选内容
  workflow_dispatch: # 允许维护者从仓库页面手动运行

permissions: # 限制自动任务能够使用的仓库权限
  contents: read # 只允许读取代码，不允许修改仓库内容

jobs: # 定义需要执行的独立检查任务
  writing-quality: # 运行规则测试和完整问答测试
    runs-on: windows-latest # 使用自带 PowerShell 的 Windows 执行环境
    steps: # 按顺序准备仓库并执行检查
      - name: Check out repository # 把当前提交下载到临时执行环境
        uses: actions/checkout@v5 # 使用基于当前运行环境的官方仓库下载步骤
      - name: Run rule checks # 验证正确写法能够通过并拦截错误写法
        shell: pwsh # 使用 PowerShell 执行项目脚本
        run: ./scripts/Test-HumanReadableChinese.Tests.ps1 # 执行全部规则正反测试
      - name: Run full answer evaluation # 验证多行业完整回答和样本差异
        shell: pwsh # 使用 PowerShell 执行项目脚本
        run: ./evals/Invoke-QualityEvaluation.20260729.ps1 # 执行全部多行业完整问答测试
      - name: Validate semantic adversarial cases # 验证语义正反案例的数量、配对和字段完整性
        shell: pwsh # 使用 PowerShell 执行案例结构检查
        run: ./evals/Invoke-NaturalChineseEvaluation.ps1 -Mode ValidateCases # 不使用模型，只验证公开案例清单
      - name: Validate live evaluation manifests # 验证触发、现场生成和盲评案例的数量与场景平衡
        shell: pwsh # 使用 PowerShell 检查公开评测清单
        run: ./evals/Measure-NaturalChineseLive.ps1 -Mode ValidateManifests # 不使用模型，只验证 24 个触发请求和 48 个现场生成请求
      - name: Test public corpus scanner # 验证扫描范围、相对路径、脱敏和代码围栏识别
        shell: pwsh # 使用 Python 标准库运行扫描器单元测试
        run: python -m unittest discover -s tests -p "test_*.py" -v # 执行全部公开语料扫描测试
      - name: Scan public repository language # 扫描当前公开仓库中的语域风险，不读取本地对话
        shell: pwsh # 使用临时目录保存扫描结果，避免把扫描产物提交进仓库
        run: python ./scripts/audit_aialra_corpus.py . --confirm-public --output "$env:RUNNER_TEMP/aialra-corpus-audit.json" # 报告只保存仓库相对路径并遮盖敏感片段
      - name: Run repository content audit # 使用技能自身的检查器验证全部公开文档和案例同步状态
        shell: pwsh # 使用 PowerShell 执行仓库级自查脚本
        run: ./scripts/Test-RepositoryContent.ps1 # 检查文档写作、案例新鲜度和相对链接
