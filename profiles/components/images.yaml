profile:
  identity:
    profile_id: image-explanation
    revision: round-4-generalization
    description: 图片按照零先验读者处理，并区分可见事实、背景与推断
  source_order:
    original_image:
      policy: before_explanation
      severity: PROFILE_REQUIRED
      description: 原图始终出现在解释前面，读者可以同步核对讲解和图中证据
  presentation:
    alignment:
      policy: github_render_verified_center
      severity: PROFILE_REQUIRED
      description: 仅当任务合同 renderer 为 github_markdown 时，GitHub 图片与图题放入同一居中 HTML 容器，并在 1280 像素与 390 像素、亮色与暗色主题中核对实际居中和横向溢出；其他媒介登记适用限制
    asset_quality:
      policy: separate_from_writing_quality
      severity: ADVISORY
      description: 图片重叠、裁切和绘制错误单独登记为资产问题，不把合格文字解释误判为写作失败
  required_coverage:
    overview:
      description: 说明图片整体展示什么以及读者应从哪里开始看
    prerequisites:
      description: 补充理解图片所需的最小先验知识
    effective_elements:
      description: 覆盖影响理解的对象、文字、图例、箭头、区域、数值、颜色、形状和空间关系
    element_functions:
      description: 说明每个有效元素的功能和它对整体结果的作用，不能只描述外观
    relationships:
      description: 说明元素之间的连接、方向、趋势、异常和重点
    impact:
      description: 说明图片支持的实际判断和影响
    limits:
      description: 说明缺少的证据、缺少这些证据为什么重要以及下一项验证方法
  completion_gate:
    policy: overview_reading_start_element_function_relationship_impact_limit
    severity: PROFILE_REQUIRED
    description: 每个有效元素必须同时有可定位的功能或作用说明；只有位置、外观或元素名称而没有功能与整体关系时，图片解释不完整；素材未提供功能依据时自然说明无法从图中确认
  provenance_layers:
    visible_fact:
      description: 图片直接显示的内容
    direct_relation:
      description: 根据箭头、位置和数值能够直接得到的关系
    background:
      description: 为帮助理解而加入并登记来源的知识
    inference:
      description: 结合上下文推导并保留强度的含义
    unresolved:
      description: 分辨率或证据不足时明确无法确认，并登记继续核对的方法
