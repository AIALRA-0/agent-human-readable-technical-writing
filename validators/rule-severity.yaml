registry:
  identity:
    registry_id: rule-severity
    description: 规则严重度决定问题由代码阻断、Agent 判断、任务配置阻断或只作建议
  levels:
    MACHINE_FINAL:
      authority: deterministic_validator
      description: 代码能够确定，不通过时直接阻断
    MACHINE_CANDIDATE:
      authority: agent_or_user
      description: 代码只定位候选，Agent 确认语境后决定
    PROFILE_REQUIRED:
      authority: active_task_profile
      description: 当前任务或用户配置明确要求，不通过时按本次契约阻断
    ADVISORY:
      authority: user_preference
      description: 用于优化，不单独阻断
  rules:
    PROTECTED_TOKEN_PRESENCE:
      severity: MACHINE_FINAL
      description: 受保护数字、路径和机器标识不能丢失
    PATCH_DOCUMENT_HASH:
      severity: MACHINE_FINAL
      description: 补丁必须绑定当前文档摘要
    POSSIBLE_REDUNDANCY:
      severity: MACHINE_CANDIDATE
      description: 重复需要根据传播边界和语境确认
    POSSIBLE_MISSING_EXPLANATION:
      severity: MACHINE_CANDIDATE
      description: 术语是否需要解释取决于读者和当前任务
    LUCAS_PUNCTUATION:
      severity: PROFILE_REQUIRED
      description: 启用 Lucas 配置时执行个人标点规则
    STANDALONE_TERM_RESET:
      severity: MACHINE_FINAL
      description: 独立阅读单元的 known_terms 必须为空，防止测试借用其他内容的解释
    SOURCE_COMPONENT_ORDER:
      severity: PROFILE_REQUIRED
      description: 原图、原表和原始代码按照组件合同保留在解释前或与解释同时出现
    MERMAID_VERTICAL_DEFAULT:
      severity: PROFILE_REQUIRED
      description: 横向 Mermaid 必须具有任务合同登记的不可替代理由
    BOUNDARY_EVIDENCE:
      severity: PROFILE_REQUIRED
      description: 边界必须登记缺失证据、重要性和下一项验证
    TABLE_CELL_COVERAGE:
      severity: PROFILE_REQUIRED
      description: 所有数据格通过列定义、值词典、行映射或单格说明完成覆盖
    ORDINARY_SENTENCE_RHYTHM:
      severity: ADVISORY
      description: 句子节奏用于优化，不作为单独失败原因
