name: vNext candidate checks # 在仓库页面显示候选基础检查名称

on: # 指定需要重新验证候选文件树的事件
  push: # 每次候选分支或默认分支推送后运行
  pull_request: # 外部贡献使用拉取请求时运行，不改变本项目的直接推送约定
  workflow_dispatch: # 允许维护者手动重新验证当前提交

permissions: # 限制自动任务只能读取仓库内容
  contents: read # 检查任务不能修改分支、标签或发布内容

jobs: # 定义相互独立的自动检查任务
  vnext-runtime: # 验证 vNext 契约、运行时、生命周期、补丁事务和前向审核材料
    runs-on: ubuntu-latest # 使用干净 Linux 环境证明基础实现不依赖本机状态
    steps: # 按照依赖准备、确定性检查、提交器测试和生成物核对的顺序执行
      - name: Check out repository # 下载触发本次检查的精确提交
        uses: actions/checkout@v5 # 使用官方仓库下载动作，不写回远端
        with: # 保留上一提交以执行精确空白差异检查
          fetch-depth: 2 # 当前提交与直接父提交都可供 git diff 使用

      - name: Set up Python # 安装与本地候选基线一致的 Python 主版本
        uses: actions/setup-python@v5 # 使用官方 Python 环境准备动作
        with: # 把运行版本固定在任务分类下面
          python-version: "3.12" # 当前候选基础在 Python 3.12 上验证

      - name: Install validation dependencies # 安装 JSON Schema 和 YAML 解析依赖
        run: python -m pip install jsonschema==4.23.0 PyYAML==6.0.2 # 使用本地验证过的精确版本，避免依赖漂移改变结果

      - name: Compile Python sources # 在运行以前发现语法和编码错误
        run: python -m compileall -q patcher runtime scripts tests validators # 只编译 vNext 实现、验证器和测试

      - name: Reject trailing whitespace # 防止审核页中的不可见差异绕过人工复核
        run: git diff --check HEAD^ HEAD # 检查本次提交引入的行尾空白和空白错误

      - name: Validate vNext foundation # 验证权威计划、契约、YAML 分类、候选案例、链接、SVG 和隐私模式
        run: python scripts/validate_vnext_foundation.py # 任一确定性缺陷都会返回非零退出状态

      - name: Execute inventoried deterministic fixtures # 运行清单登记的全部确定性正反例
        run: python scripts/run_vnext_fixtures.py # 文件、摘要、分布、数量或判定不一致都会失败

      - name: Validate dynamic lifecycle records and pending candidates # 按实际轮次核对 Gold、Rejected、Candidate、摘要和明确用户决定
        run: python scripts/validate_vnext_lifecycle.py # 记录数随人工拒绝和新轮次动态增长，自动检查不得改变人工状态

      - name: Validate inventoried contextual cases # 检查术语、排比、代码、内容充分性、长上下文、多轮、主语、标点和段落的职责边界
        run: python scripts/validate_context_cases.py # 清单固定文件与分布，语义边界继续由 Agent 或用户决定

      - name: Validate broad-coverage forward-round declarations # 核对长度、受众、任务、变化配额及主题素材去重
        run: python scripts/validate_forward_rounds.py # 下一轮在上一轮所有修订获明确接受前保持硬门关闭

      - name: Validate long-context stress evidence # 核对八项 1200-3000 字隔离压力案例和脱敏执行摘要
        run: python scripts/validate_long_context_stress.py # 8/8 只作为发布证据，不能写入用户接受字段

      - name: Validate 72-case trigger matrix evidence # 核对三类任务各自的显式、隐式、负向和规则遵守案例及脱敏执行摘要
        run: python scripts/validate_trigger_matrix.py --require-results # 要求固定模型 72/72 通过、同行辅助器事件齐全且公开结果不含原始正文

      - name: Validate first forward round # 核对 20 个首次生成答案的摘要、来源映射、组件保留和隐私
        run: python scripts/validate_forward_round1.py # 只检查确定性事实，人工接受结果继续保持为空

      - name: Test deterministic committer # 验证精确替换、拒绝路径和整批回滚
        run: python -m unittest discover -s tests -p "test_deterministic_committer.py" -v # 按当前测试清单执行，不维护手写数量

      - name: Test executable runtime # 验证 compile、verify、repair、长上下文拒绝和 report 的结构化接口
        run: python -m unittest discover -s tests -p "test_vnext_runtime.py" -v # 按当前测试清单执行，不要求外部 Agent

      - name: Test forward review and round gates # 验证完整发现、分批审核、摘要绑定、幂等迁移和动态轮次门槛
        run: python -m unittest discover -s tests -p "test_forward_review_workflow.py" -v # 自动测试只能验证证据与迁移，不能产生用户接受

      - name: Test recoverable round-two review finalization # 验证中间态只返回结构化阻断，准备完成后才生成正式账本
        run: python -m unittest discover -s tests -p "test_round2_review_finalizer.py" -v # 临时迁移源不能被验证器误当成人工接受账本

      - name: Test isolated self-iterative workflow # 验证会话绑定、访问审计、局部补丁、组件保真和复验后通过
        run: python -m unittest discover -s tests -p "test_self_iterative_workflow.py" -v # 不调用外部模型，只执行编排和合同回归

      - name: Verify generated evidence synchronization # 确认确定性案例、审核包和前向候选摘要能够从登记源重建
        run: python scripts/build_vnext_minimal_cases.py && python scripts/build_eval_inventory.py && python scripts/build_vnext_trigger_matrix.py && python scripts/build_forward_round1_requests.py && python scripts/materialize_forward_round1.py && python scripts/apply_vnext_round3_review.py && python scripts/build_round4_review_packet.py && python scripts/apply_vnext_round4_review.py && python scripts/build_round5_review_packet.py && python scripts/apply_vnext_round5_review.py && python scripts/rebuild_forward_rounds.py && python scripts/build_long_context_stress.py && git diff --exit-code -- evals/candidate evals/gold evals/rejected evals/deterministic evals/contextual evals/trigger-matrix/vnext-1.1-72-cases.jsonl evals/forward evals/long-context/vnext-1.1-8-cases.jsonl evals/reviews/vnext-1.1-round-4-REVIEW-PACKET.md evals/reviews/vnext-1.1-round-5-REVIEW-PACKET.md # 任何用户快照、案例清单、首次答案、长上下文案例、审核账本或修订证据变化都会阻止候选提交
