profile:
  identity:
    profile_id: table-explanation
    revision: round-4-generalization
    description: 表格解释通过列定义、值词典和行映射覆盖全部数据，同时避免机械逐格复述
  source_order:
    original_table:
      policy: before_explanation
      severity: PROFILE_REQUIRED
      description: 原表保留在解释前面，读者可以直接核对数据
    source_integrity:
      policy: preserve_headers_columns_rows_cells_and_order
      severity: PROFILE_REQUIRED
      description: 解释不得新增、删除、重排列或把说明塞入数据格；适配媒介时只转换外层标记，原表数据与结构必须保持可核对
  presentation:
    alignment:
      policy: github_render_verified_html
      severity: PROFILE_REQUIRED
      description: 仅当任务合同 renderer 为 github_markdown 时，GitHub 表格使用可访问 HTML 和居中容器，表题放在表格下方，并在 1280 像素与 390 像素、亮色与暗色主题中核对实际居中和横向溢出；其他媒介登记适用限制
  required_coverage:
    overview:
      description: 说明表格整体回答什么
    columns:
      description: 逐列说明名称、单位、允许值或内容范围和实际作用；不能只写常态耗时、限制等汇总概念来代替缺失的列覆盖
    rows:
      description: 说明每一行代表的对象
    value_dictionary:
      description: 相同值统一解释一次，后续数据格引用同一含义
    row_mapping:
      description: 把每行数据映射到列定义和值词典，不机械复述已经定义的相同含义
    exceptional_cells:
      description: 单独解释异常值、缺失值、歧义值和决定结论的关键数据格
    comparisons:
      description: 说明行与行、列与列的比较依据和实际差异
    findings:
      description: 说明趋势、异常和数据支持的结论
    limits:
      description: 说明缺少的证据、实际影响和下一项验证方法
  internal_coverage:
    cell_ledger:
      policy: all_cells_mapped
      severity: PROFILE_REQUIRED
      description: 每个数据格必须由列定义、值词典、行映射或单格解释至少覆盖一次
  output_strategy:
    main_text:
      description: 解释阅读方法、主要关系、趋势、异常和结论
    appendix:
      description: 只有大型表格需要逐格审计时才生成单元格附录
  completion_gate:
    policy: source_integrity_before_external_explanation
    severity: PROFILE_REQUIRED
    description: 先完成原表结构与数据核对，再在表格外说明列、行、值、异常、比较和限制；解释列不能替代原表，也不能改变原表列数
