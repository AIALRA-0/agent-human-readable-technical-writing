registry:
  identity:
    registry_id: rule-severity
    description: 规则严重度决定问题由代码阻断、Agent 判断、任务配置阻断或只作建议
  levels:
    MACHINE_FINAL:
      authority: deterministic_validator
      description: 代码能够确定，不通过时直接阻断
    MACHINE_CANDIDATE:
      authority: agent_or_user
      description: 代码只定位候选，Agent 确认语境后决定
    PROFILE_REQUIRED:
      authority: active_task_profile
      description: 当前任务或用户配置明确要求，不通过时按本次契约阻断
    ADVISORY:
      authority: user_preference
      description: 用于优化，不单独阻断
  rules:
    PROTECTED_TOKEN_PRESENCE:
      severity: MACHINE_FINAL
      description: 受保护数字、路径和机器标识不能丢失
    PATCH_DOCUMENT_HASH:
      severity: MACHINE_FINAL
      description: 补丁必须绑定当前文档摘要
    POSSIBLE_REDUNDANCY:
      severity: MACHINE_CANDIDATE
      description: 重复需要根据传播边界和语境确认
    POSSIBLE_MISSING_EXPLANATION:
      severity: MACHINE_CANDIDATE
      description: 术语是否需要解释取决于读者和当前任务
    ACTOR_CLARITY:
      severity: MACHINE_CANDIDATE
      description: 主体是否明确依赖段落上下文，代码只能检查登记是否完整，不能机械要求每句重复主体
    LUCAS_PUNCTUATION:
      severity: PROFILE_REQUIRED
      description: 启用 Lucas 配置时执行个人标点规则
    STANDALONE_TERM_RESET:
      severity: MACHINE_FINAL
      description: 独立阅读单元的 known_terms 必须为空，防止测试借用其他内容的解释
    REGISTERED_TERM_CASE:
      severity: MACHINE_FINAL
      description: 登记表已经确认的品牌、缩写和正式名称必须使用登记大小写
    PARENTHETICAL_ENGLISH_CASE:
      severity: MACHINE_FINAL
      description: 登记表已经确认的括号英文名称和类别必须使用标题式大小写或官方写法
    ACRONYM_EXPANSION:
      severity: MACHINE_FINAL
      description: 登记表明确禁止展开的名称不能伪造成首字母缩写
    UNVERIFIED_OFFICIAL_CASE:
      severity: MACHINE_CANDIDATE
      description: 未登记名称无法确认官方大小写时返回 REVIEW_REQUIRED，程序不能猜测
    SOURCE_COMPONENT_ORDER:
      severity: PROFILE_REQUIRED
      description: 原图、原表和原始代码按照组件合同保留在解释前或与解释同时出现
    MERMAID_VERTICAL_DEFAULT:
      severity: PROFILE_REQUIRED
      description: 横向 Mermaid 必须具有任务合同登记的不可替代理由
    BOUNDARY_EVIDENCE:
      severity: PROFILE_REQUIRED
      description: 边界必须登记缺失证据、重要性和下一项验证
    TABLE_CELL_COVERAGE:
      severity: PROFILE_REQUIRED
      description: 所有数据格通过列定义、值词典、行映射或单格说明完成覆盖
    SOURCE_PRESENTATION:
      severity: PROFILE_REQUIRED
      description: 任务要求保留原始材料时，短文本、代码、图片和表格使用对应呈现方式
    COMPONENT_ALIGNMENT:
      severity: PROFILE_REQUIRED
      description: 媒介支持精确控制时，图表对象与题注共同居中，受限时必须登记渲染边界
    EXCESSIVE_BLANK_LINES:
      severity: MACHINE_FINAL
      description: 连续两个以上空行会造成无意义纵向稀疏，确定性检查直接阻断
    INLINE_CODE_MARKUP:
      severity: MACHINE_FINAL
      description: 任务合同登记的命令、字段、路径和代码标识必须使用反引号
    ORDINARY_SENTENCE_RHYTHM:
      severity: ADVISORY
      description: 句子节奏用于优化，不作为单独失败原因
    LOCAL_NOTATION_CONSISTENCY:
      severity: ADVISORY
      description: 同一解释单元优先统一引号、冒号和同类标记，不单独阻断交付
    COMMA_SEMICOLON_CHOICE:
      severity: ADVISORY
      description: 逗号与分号按照分句关系选择，不使用频率阈值或单字硬门
