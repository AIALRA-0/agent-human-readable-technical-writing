profile:
  identity:
    profile_id: lucas
    revision: two-layer-format-novice-2026-09-08
    description: Lucas 已明确确认的个人写作要求
  punctuation:
    chinese_full_stop:
      policy: forbidden_in_generated_chinese
      severity: PROFILE_REQUIRED
      description: 生成的普通中文正文不使用中文句号
    internal_pause:
      policy: compact_parallel_or_term_semicolon_only
      severity: PROFILE_REQUIRED
      description: 分号只用于同一行的紧凑并列分句或专业词说明，一旦内容构成多个独立项目就换行并按层级缩进
    paragraph_ending:
      policy: no_trailing_full_stop_or_semicolon
      severity: PROFILE_REQUIRED
      description: 段落末尾不保留中文句号或中文分号
    verbatim_exception:
      policy: preserve
      severity: MACHINE_FINAL
      description: 逐字引文、日志、代码和用户要求原样保留的材料不改标点
  structure:
    section_numbering:
      policy: adaptive_markdown_heading
      severity: PROFILE_REQUIRED
      description: 根据内容结构选择需要的 Markdown 标题层级，短单主题内容不设置标题，多章节文档需要编号时再使用 1.、1.1. 和 1.1.1. 形式
    colon_pseudo_heading:
      policy: forbidden
      severity: PROFILE_REQUIRED
      description: 禁止使用操作、术语、证据边界等冒号结尾的伪标题，需要分区时使用适当 Markdown 标题，不需要分区时直接成文；自然完整句引出后续列表、引文或示例时使用冒号，不属于伪标题
    captions:
      policy: below_object
      severity: PROFILE_REQUIRED
      description: 表格、图片和 Mermaid 题注默认放在对象下方，用户指定出版规范时采用对应规则
    visual_alignment:
      policy: verified_center
      severity: PROFILE_REQUIRED
      description: 任务合同明确使用 github_markdown 时，图片和表格使用居中 HTML，Mermaid 使用原生代码块加居中题注，并以桌面、移动端、亮色和暗色实际渲染结果作为通过依据；其他媒介不伪造 GitHub 渲染证据
    blank_lines:
      policy: one_between_semantic_blocks
      severity: PROFILE_REQUIRED
      description: 不同主题或块级结构之间最多保留一个空行，同一列表与嵌套列表内部不插入空行
    parallel_items:
      policy: indented_list
      severity: PROFILE_REQUIRED
      description: 两个以上独立的定义、步骤、比较对象、事实、原因或动作换行并缩进，不以是否出现冒号作为判断条件；单个术语的五段解释属于同一连续定义块，不拆子列表
    topic_boundary:
      policy: separate_paragraph
      severity: PROFILE_REQUIRED
      description: 不属于同一主题的内容分别成段，短内容不能成为合并主题的理由
    single_followup:
      policy: no_single_item_colon
      severity: PROFILE_REQUIRED
      description: 只有一个紧随说明时使用逗号或独立句，不用冒号制造单项列表
    mermaid_direction:
      policy: vertical_by_default
      severity: PROFILE_REQUIRED
      description: Mermaid 默认使用 flowchart TD，横向排列需要任务合同登记不可替代理由
    mermaid_explanation:
      policy: post_figure_explanation
      severity: PROFILE_REQUIRED
      description: 每张 Mermaid 图后解释节点关系和流程结果，只有证据限制影响理解、决定或操作时才自然说明
  terminology:
    standalone_scope:
      policy: reset_known_terms
      severity: PROFILE_REQUIRED
      description: 独立阅读单元和独立测试的 known_terms 为空，每个单元重新证明首次解释能力
    natural_embedding:
      policy: formal_name_then_natural_prose
      severity: PROFILE_REQUIRED
      description: 括号只放正式英文全称、通用英文类别或缩写；普通英文名称和类别使用标题式大小写，官方品牌和正式名称保持官方大小写；定义、用途、表现和影响写在括号外的自然正文中
    professional_first_use:
      policy: five_part_first_use_definition
      severity: PROFILE_REQUIRED
      description: 专业术语首次使用带列表标记的中文全称（English Full Name）：定义，有缩写时置于中文全称之前；定义保持一个连续块，以三至五句覆盖是什么、干什么、怎么干、何时干、如何区分；词源和历史不再普遍必填，普通词不造英文，未知官方形式不编造也不卡住整篇交付
    translation_english_name:
      policy: retain_official_english
      severity: PROFILE_REQUIRED
      description: 翻译任务默认在对应源语义首次出现的位置使用正式中文并保留官方英文名称，不能先用泛称代替、再依靠后置术语表补救；连续文档只有在前文已经完成解释后才能使用简称
  conversation:
    superseded_requirements:
      policy: current_effective_only
      severity: PROFILE_REQUIRED
      description: 追加要求替换旧要求后，最终答案只保留当前有效内容；只有用户要求历史、审计、证据核对或撤销说明时才保留旧要求
  explanation:
    reader_baseline:
      policy: novice_with_no_domain_background
      severity: PROFILE_REQUIRED
      description: 默认读者第一次接触当前技术与知识，每个实际用到的对象和结论补齐必要前提、机制、具体示范和判断条件，按 references/explanation-framework.md 执行
    actor_clarity:
      policy: explicit_on_start_change_or_ambiguity
      severity: MACHINE_CANDIDATE
      description: 独立动作、主体切换和可能产生歧义的位置明确主体，同一明确主体的连续内容允许自然省略
    default_order:
      policy: goal_prerequisite_mechanism_example_boundary
      severity: PROFILE_REQUIRED
      description: 从用户目标出发，按理解依赖补齐前提，说明机制、实例、可观察结果与适用边界；不强制每篇出现同一套章节标题
    boundary:
      policy: evidence_gap_importance_next_check
      severity: PROFILE_REQUIRED
      description: 解释或决策任务中的重要否定边界说明缺少的证据、实际影响和下一项核对方法；COMPRESS + NONE 等不允许解释增量的任务只保留原文已经表达的未知或未检查范围，不创造影响判断、建议或核对动作
    boundary_visibility:
      policy: internal_then_natural_when_material
      severity: PROFILE_REQUIRED
      description: 证据边界默认只进入内部验证包，只有影响结论、操作或安全时才在正文自然说明，禁止直接输出证据边界、验证边界或内部边界标签
    logic:
      policy: forward
      severity: ADVISORY
      description: 优先按照时间、因果或操作顺序展开，避免无必要插叙和倒叙
  code:
    inline_comment_alignment:
      policy: longest_commentable_line
      severity: PROFILE_REQUIRED
      description: 每个代码块内所有可注释有效语句使用同行注释，注释标记从最长可注释代码行之后的同一列开始；允许对齐增加行宽
    alignment_scope:
      policy: per_code_block
      severity: MACHINE_FINAL
      description: 不跨代码块计算最长行；空行、纯闭合符和结构性括号不参与计算
    alignment_padding:
      policy: exact_l_minus_w_plus_one
      severity: MACHINE_FINAL
      description: 同块最长显示宽度为 L、当前行宽度为 W 时精确补 L-W+1 个空格，输出前复算每个注释标记的 1 基列号必须等于 L+2
    alignment_preflight:
      policy: deterministic_helper_required
      severity: MACHINE_FINAL
      description: 两个以上可注释语句使用 runtime/align_inline_comments.py 对齐并复验，最多两轮局部修复；普通交付保留仍未修好的文本，测试如实记录问题
    non_commentable_fallback:
      policy: line_by_line_explanation
      severity: PROFILE_REQUIRED
      description: JSON 等不能合法添加注释的格式保留原文并逐行解释，同行对齐不适用
  delivery:
    self_iteration:
      policy: reread_check_patch_up_to_two
      severity: PROFILE_REQUIRED
      description: 生成后重新读取格式规则和解释框架，由当前助手复核，最多两轮中间件局部修复；外部助手只用于开发测试
    repair_scope:
      policy: smallest_complete_unit
      severity: MACHINE_FINAL
      description: 能用字符、词组、单句或列表项补丁修复时不得重写无关段落或全文，无法安全提交时保持原稿，普通交付不因格式残留中断
    user_visible_artifact:
      policy: final_text_with_nonblocking_format_review
      severity: PROFILE_REQUIRED
      description: 普通用户看到复核后的最终正文，未解决问题仅在影响理解或操作时自然说明；初稿、检查与补丁保留为测试证据，不能冒充用户接受
  source_presentation:
    short_verbatim_text:
      policy: blockquote
      severity: PROFILE_REQUIRED
      description: 短篇逐字原文、用户原话和需要核对的证据文本使用引用块，普通强调和生成结论不使用引用块
    code_and_logs:
      policy: fenced_code
      severity: MACHINE_FINAL
      description: 代码和日志使用对应语言的代码块并保持原文
    inline_identifiers:
      policy: backticks
      severity: MACHINE_FINAL
      description: 命令、字段、代码标识符、路径和代码类型使用反引号；普通审计编号、复核编号和人类可读票据号在叙述中不自动视为代码标识符
